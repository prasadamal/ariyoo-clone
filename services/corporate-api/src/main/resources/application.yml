spring:
  application:
    name: ariyoo-corporate-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ariyoo_corporate}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:}
    hikari:
      # Free-tier databases allow few connections.
      maximum-pool-size: ${DB_POOL_SIZE:4}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
  # Behind Render's proxy: use the real caller address (needed for rate limiting).
  forward-headers-strategy: native
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
ariyoo:
  # Comma-separated origins allowed to call the API from a browser (the website). Required in production.
  cors-origins: ${CORS_ORIGINS:http://localhost:4000}
  # Key for /api/admin/**. Leave empty to switch the admin API off entirely.
  admin-key: ${ADMIN_API_KEY:}
  # Requests allowed per address per minute on the public forms.
  form-rate-limit: ${FORM_RATE_LIMIT:5}
