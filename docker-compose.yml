# Local/staging stack: Postgres + API. Copy .env.example to .env at the repo root first.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ariyoo
      POSTGRES_USER: ariyoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ariyoo -d ariyoo"]
      interval: 5s
      timeout: 5s
      retries: 10
    # DB port is intentionally NOT published. Uncomment for local tooling only:
    # ports: ["127.0.0.1:5432:5432"]

  api:
    build: ./services/api
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://ariyoo:${POSTGRES_PASSWORD}@db:5432/ariyoo?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (>=32 chars)}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      UPLOAD_DIR: /app/uploads
    ports:
      - "3333:3333"
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

volumes:
  db_data:
  uploads:
