appId: com.wayfare.app
name: A second journey, then the home swipe
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Device test trip"
    timeout: 60000
- tapOn: "Start a new journey"
- tapOn: "Journey title"
- inputText: "Second test trip"
- scrollUntilVisible:
    element: "Create journey"
    direction: DOWN
    timeout: 20000
- tapOn: "Create journey"
- extendedWaitUntil:
    visible: "Plan"
    timeout: 30000
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "All trips"
    timeout: 60000
- takeScreenshot: 06-home-two-trips
# A light flick must not open the list...
- swipe:
    start: "50%, 55%"
    end: "50%, 50%"
    duration: 600
- waitForAnimationToEnd
- assertNotVisible: "ALL TRIPS"
- takeScreenshot: 07-light-swipe
# ...a firm swipe up does.
- swipe:
    start: "50%, 70%"
    end: "50%, 20%"
    duration: 300
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "ALL TRIPS"
    timeout: 5000
- takeScreenshot: 08-firm-swipe-list
- back
- waitForAnimationToEnd
- assertNotVisible: "ALL TRIPS"
