appId: com.wayfare.app
name: A second journey, then the home swipe
---
- hideKeyboard
- back
- waitForAnimationToEnd
- back
- extendedWaitUntil:
    visible: "Device test trip"
    timeout: 20000
- tapOn: "Start a new journey"
- tapOn: "Journey title"
- inputText: "Second test trip"
- hideKeyboard
- tapOn: "Create journey"
- extendedWaitUntil:
    visible: "Plan"
    timeout: 30000
- back
- extendedWaitUntil:
    visible: "All trips"
    timeout: 20000
- takeScreenshot: 06-home-two-trips
- swipe:
    start: "50%, 55%"
    end: "50%, 50%"
    duration: 600
- waitForAnimationToEnd
- assertNotVisible: "ALL TRIPS"
- takeScreenshot: 07-light-swipe
- swipe:
    start: "50%, 70%"
    end: "50%, 20%"
    duration: 300
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "ALL TRIPS"
    timeout: 5000
- takeScreenshot: 08-firm-swipe-list
- back
- waitForAnimationToEnd
- assertNotVisible: "ALL TRIPS"
