appId: com.wayfare.app
name: Add expense with the keyboard up
---
# Starts fresh from home (the app keeps the guest journey from flow 1).
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Device test trip"
    timeout: 60000
- tapOn: "Device test trip"
- extendedWaitUntil:
    visible: "Budget"
    timeout: 30000
- tapOn: "Budget"
- tapOn:
    text: "Add expense"
    index: 0
- extendedWaitUntil:
    visible: "Amount.*"
    timeout: 10000
- inputText: "500"
- waitForAnimationToEnd
- takeScreenshot: 05-expense-sheet-keyboard
