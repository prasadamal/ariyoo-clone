appId: com.wayfare.app
name: A light, slow swipe on the tiles
---
# Whether All trips stayed closed is checked afterwards from what TalkBack sees (device-checks.sh):
# the closed panel waits just below the screen, so Maestro's own visibility check can't tell.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "All trips"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: 06-home-two-trips
- swipe:
    start: "50%, 55%"
    end: "50%, 50%"
    duration: 600
- waitForAnimationToEnd
- takeScreenshot: 07-light-swipe
