name: Wayfare APK (GitHub build, no EAS)

# An alternative to EAS builds. It only builds an APK you can download; it changes nothing else.
# Runs on a push to the branch claude/wayfare-apk-build, or by hand from the Actions tab.
on:
  push:
    branches: [claude/wayfare-apk-build]
    # Changes to the device checks alone re-run those (wayfare-device-checks.yml), not the build.
    paths-ignore:
      - apps/wayfare-mobile/e2e/**
      - .github/workflows/wayfare-device-checks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/wayfare-mobile
    env:
      # Public values (same as the preview profile in eas.json).
      EXPO_PUBLIC_SUPABASE_URL: https://ujtylwimukufmbungnju.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqdHlsd2ltdWt1Zm1idW5nbmp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MTczMjQsImV4cCI6MjEwNjI5MzMyNH0.CJPE_jPoEHbu0UC9GxYyAlk0IkxPZCSBjem26X3mj1w
      # Optional: add a repository secret named GOOGLE_MAPS_API_KEY to get maps on Android.
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/wayfare-mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner already includes the Android SDK, so no extra setup step is needed.
      - run: npm ci
      - name: Check the code first
        run: npm run verify
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build the APK
        working-directory: apps/wayfare-mobile/android
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"
      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk wayfare-${GITHUB_SHA::7}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wayfare-apk
          path: apps/wayfare-mobile/wayfare-*.apk
          retention-days: 14

  # Release checks on the APK just built: an audit and a run on an Android phone emulator.
  device-checks:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wayfare-apk
          path: apk
      - name: Audit the APK (permissions, 16 KB pages, signing, exported parts)
        run: bash apps/wayfare-mobile/e2e/apk-audit.sh "$(ls apk/*.apk)" 2>&1 | tee audit.txt
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro (scripted UI flows)
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash
      - name: Run on an Android phone emulator (Pixel 6, Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash apps/wayfare-mobile/e2e/device-checks.sh "$(ls apk/*.apk)" device-results
      - name: Report
        if: always()
        run: |
          { echo '```'; cat audit.txt; echo '```'; cat device-results/summary.md 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"
          echo "===== REPORT ====="; cat audit.txt; cat device-results/summary.md 2>/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-results
          path: |
            device-results
            audit.txt
          retention-days: 14
