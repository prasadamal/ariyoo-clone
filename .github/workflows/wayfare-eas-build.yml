name: Wayfare EAS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/wayfare-mobile/**'

jobs:
  build:
    runs-on: ubuntu-latest
    # `secrets` is not allowed in step conditions; expose it through env instead.
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: apps/wayfare-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/wayfare-mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: EAS Build (production)
        if: env.EXPO_TOKEN != ''
        run: npx eas-cli build --platform all --profile production --non-interactive --no-wait
