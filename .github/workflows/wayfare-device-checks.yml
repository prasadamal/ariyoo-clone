name: Wayfare device checks (latest APK)

# Release checks on a real Android emulator, run against the newest APK built on the APK branch:
# an APK audit (what Google Play checks at upload), scripted flows (Maestro), the keyboard over the
# Plan and expense sheets, cold start, Google's monkey stress test, crash/freeze scan and memory.
# The APK workflow runs the same checks on every new APK; this one re-runs them when only the
# checks change, without rebuilding.
on:
  push:
    branches: [claude/wayfare-apk-build]
    paths:
      - apps/wayfare-mobile/e2e/**
      - .github/workflows/wayfare-device-checks.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Get the newest APK
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: wayfare-apk-github.yml
          branch: claude/wayfare-apk-build
          workflow_conclusion: success
          name: wayfare-apk
          path: apk
      - name: Audit the APK (permissions, 16 KB pages, signing, exported parts)
        run: bash apps/wayfare-mobile/e2e/apk-audit.sh "$(ls apk/*.apk)" 2>&1 | tee audit.txt
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro (scripted UI flows)
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash
      - name: Run on an Android phone emulator (Pixel 6, Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash apps/wayfare-mobile/e2e/device-checks.sh "$(ls apk/*.apk)" device-results
      - name: Report
        if: always()
        run: |
          { echo '```'; cat audit.txt; echo '```'; cat device-results/summary.md 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"
          echo "===== REPORT ====="; cat audit.txt; cat device-results/summary.md 2>/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-results
          path: |
            device-results
            audit.txt
          retention-days: 14
