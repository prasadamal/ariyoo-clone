name: Ariyoo validation and manual store build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-eas-build.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-eas-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    # `secrets` is not allowed in step conditions; expose it through env instead.
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check requested store build configuration
        working-directory: .
        if: github.event_name == 'workflow_dispatch'
        env:
          EAS_PROJECT_ID: ${{ vars.ARIYOO_EAS_PROJECT_ID }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Set the EXPO_TOKEN repository secret before requesting a store build."
            exit 1
          fi
          if [ -z "$EAS_PROJECT_ID" ]; then
            echo "::error::Set the ARIYOO_EAS_PROJECT_ID repository variable to this app's Expo project UUID."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Android and iOS bundles
        run: |
          npx expo export --platform android --output-dir "$RUNNER_TEMP/export-android"
          npx expo export --platform ios --output-dir "$RUNNER_TEMP/export-ios"
      - name: Native project generation
        run: npx expo prebuild --platform all --no-install
      - name: EAS Build (production)
        if: github.event_name == 'workflow_dispatch'
        env:
          EAS_PROJECT_ID: ${{ vars.ARIYOO_EAS_PROJECT_ID }}
        run: npx --yes eas-cli@27.10.0 build --platform all --profile production --non-interactive --wait
      - name: Explain validation-only run
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "Validation only. No signed Android or iOS build was requested. Use Run workflow to request a production build." >> "$GITHUB_STEP_SUMMARY"
