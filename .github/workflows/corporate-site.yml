name: Corporate site
on:
  pull_request:
    paths: ['apps/corporate-web/**', '.github/workflows/corporate-site.yml']
  push:
    branches: [main]
    paths: ['apps/corporate-web/**', '.github/workflows/corporate-site.yml']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/corporate-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/unit.test.mjs
      - run: node tools/check-links.mjs
