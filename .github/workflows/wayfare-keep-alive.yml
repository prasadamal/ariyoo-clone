name: Wayfare backend keep-alive

# Supabase pauses a free project after 7 days without database activity, and a paused project
# breaks sign-in, sync and shared links until someone restores it by hand. Every two days this
# makes one read-only, anonymous call that touches the database (a share-link lookup for an id
# that does not exist). It needs no secrets: the project URL and the public anon key are read
# from docs/wayfare-config.js, which the web viewers already publish.
#
# A red run means the project is paused, deleted or misconfigured: open supabase.com, project
# "wayfare", and press Restore (GitHub emails the repository owner when a scheduled run fails).
# GitHub turns off scheduled workflows after 60 days without commits; re-enable it under Actions.
on:
  schedule:
    - cron: '23 4 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/wayfare-config.js
          sparse-checkout-cone-mode: false
      - name: Touch the database
        run: |
          url=$(sed -n "s/^ *supabaseUrl: '\([^']*\)'.*/\1/p" docs/wayfare-config.js)
          key=$(sed -n "s/^ *supabaseAnonKey: '\([^']*\)'.*/\1/p" docs/wayfare-config.js)
          case "$url" in https://*.supabase.co) ;; *) echo "::error::docs/wayfare-config.js has no project URL"; exit 1;; esac
          status=$(curl -sS -o body.txt -w '%{http_code}' --max-time 60 \
            -X POST "$url/rest/v1/rpc/get_shared_trip" \
            -H "apikey: $key" -H "Authorization: Bearer $key" -H 'Content-Type: application/json' \
            -d '{"p_share_id":"keepalive-not-a-real-id"}')
          echo "HTTP $status: $(head -c 200 body.txt)"
          if [ "$status" != 200 ]; then
            echo "::error::Wayfare backend answered $status. If the project is paused, restore it at supabase.com."
            exit 1
          fi
