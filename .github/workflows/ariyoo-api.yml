name: Ariyoo API
on:
  pull_request:
    paths: ['services/api/**', '.github/workflows/ariyoo-api.yml']
  push:
    branches: [main]
    paths: ['services/api/**', '.github/workflows/ariyoo-api.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm test
      - name: Build production image
        run: docker build -t ariyoo-api:check .
