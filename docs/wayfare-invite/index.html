<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join a journey on Wayfare</title>
  <meta name="description" content="You've been invited to a travel journey on Wayfare." />
  <style>
    :root { --ink: #1c1917; --muted: #6b6b72; --bg: #ffffff; --card: #f3ecf8; --brand: #6a01a3; --accent: #fe9f41; }
    @media (prefers-color-scheme: dark) { :root { --ink: #f5f5f4; --muted: #a8a29e; --bg: #121014; --card: #221a2a; --brand: #c77dff; } }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
    main { max-width: 26rem; margin: 0 auto; padding: 3rem 1rem; text-align: center; }
    .badge { width: 72px; height: 72px; border-radius: 50%; background: var(--card); display: grid; place-items: center; margin: 0 auto 1rem; font-size: 34px; }
    h1 { font-size: 1.6rem; margin: .25rem 0 .5rem; }
    p { color: var(--muted); margin: .25rem 0 1rem; }
    a.button { display: block; background: var(--brand); color: #fff; text-decoration: none; padding: .9rem 1rem; border-radius: 999px; font-weight: 700; margin-top: 1.25rem; }
    .small { font-size: .85rem; margin-top: 1.5rem; }
    .dot { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <div class="badge" aria-hidden="true">🧭</div>
    <h1>You're invited to a journey<span class="dot">.</span></h1>
    <p>Someone shared their trip with you on Wayfare, the private travel journal. Open it in the app to join.</p>
    <a class="button" id="open" href="#">Open in Wayfare</a>
    <p class="small">Don't have Wayfare yet? Ask the friend who sent this for the app, install it, then tap this link again. The invite works for 7 days.</p>
  </main>
  <script>
    // The token only ever travels to the app on this phone; this page sends nothing anywhere.
    var t = new URLSearchParams(location.search).get('t') || '';
    var safe = /^[a-f0-9]{16,64}$/i.test(t) ? t : '';
    var link = safe ? 'wayfare://invite/' + safe : 'wayfare://';
    document.getElementById('open').setAttribute('href', link);
    if (safe) setTimeout(function () { location.href = link; }, 400);
  </script>
</body>
</html>
