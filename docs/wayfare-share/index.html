<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wayfare journey</title>
  <meta name="description" content="A travel journey shared from Wayfare." />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root { --ink: #1c1917; --muted: #78716c; --bg: #fafaf9; --card: #fff; --line: #e7e5e4; --ember: #c2410c; --teal: #0f766e; }
    @media (prefers-color-scheme: dark) { :root { --ink: #fafaf9; --muted: #a8a29e; --bg: #0c0a09; --card: #1c1917; --line: #292524; --ember: #fb923c; --teal: #2dd4bf; } }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; margin: 0; color: var(--ink); background: var(--bg); line-height: 1.55; }
    main { max-width: 42rem; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    .hero { background: linear-gradient(135deg, #ea580c, #7c2d12); color: #fff; border-radius: 20px; padding: 1.25rem; }
    .hero small { opacity: .8; letter-spacing: .08em; font-weight: 700; }
    .hero h1 { margin: .25rem 0; font-size: 1.7rem; line-height: 1.2; }
    .pills { display: flex; flex-wrap: wrap; gap: .4rem; margin: .9rem 0; }
    .pill { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: .2rem .7rem; font-size: .85rem; }
    #map { height: 260px; border-radius: 16px; margin-top: 1rem; display: none; }
    .entry { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: .8rem 1rem; margin-top: .8rem; }
    .entry time { font-size: .78rem; color: var(--muted); }
    .place { color: var(--teal); font-weight: 650; }
    .meta { color: var(--muted); font-size: .85rem; }
    .error { color: #b91c1c; }
    footer { margin-top: 2rem; color: var(--muted); font-size: .85rem; text-align: center; }
    a { color: var(--ember); }
  </style>
</head>
<body>
  <main>
    <div class="hero">
      <small>A WAYFARE JOURNEY</small>
      <h1 id="title">Loading journey…</h1>
      <div id="sub"></div>
    </div>
    <div class="pills" id="pills"></div>
    <div id="map" role="img" aria-label="Recorded route"></div>
    <p class="error" id="err" role="alert"></p>
    <section id="entries" aria-label="Journal entries"></section>
    <footer>
      Shared read-only from <strong>Wayfare</strong> — your journey, journaled.<br />
      <a id="open-app" href="#">Open in the app</a>
    </footer>
  </main>
  <script src="../wayfare-config.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    (function () {
      const el = window.wayfareEl;
      const shareId = new URLSearchParams(location.search).get('id');
      const err = document.getElementById('err');
      const fmtDate = d => (d ? new Date(d + 'T00:00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '');
      if (!shareId) {
        document.getElementById('title').textContent = 'Wayfare journey';
        err.textContent = 'This link is missing its journey id.';
        return;
      }
      document.getElementById('open-app').href = 'wayfare://share/' + encodeURIComponent(shareId);
      window
        .wayfareRpc('get_shared_trip', { p_share_id: shareId })
        .then(data => {
          if (!data || !data.trip) {
            document.getElementById('title').textContent = 'Journey not found';
            err.textContent = 'This link may have been turned off by its owner.';
            return;
          }
          const t = data.trip;
          document.title = t.title + ' · Wayfare';
          document.getElementById('title').textContent = t.title;
          const dates = [fmtDate(t.starts_on), fmtDate(t.ends_on)].filter(Boolean).join(' – ');
          document.getElementById('sub').textContent = [t.destination, dates, data.author ? 'by ' + data.author.display_name : null]
            .filter(Boolean)
            .join(' · ');
          const pills = document.getElementById('pills');
          if (data.stats) {
            pills.append(el('span', { class: 'pill', text: data.stats.entry_count + ' moments' }));
            if (data.stats.route_km > 0) pills.append(el('span', { class: 'pill', text: '✓ ' + data.stats.route_km + ' km GPS-verified' }));
          }
          const route = Array.isArray(data.route) ? data.route.map(p => [p[1], p[0]]) : [];
          if (route.length > 1 && window.L) {
            const mapEl = document.getElementById('map');
            mapEl.style.display = 'block';
            const map = L.map(mapEl, { scrollWheelZoom: false });
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              maxZoom: 17,
              attribution: '&copy; OpenStreetMap contributors',
            }).addTo(map);
            const line = L.polyline(route, { color: '#c2410c', weight: 4 }).addTo(map);
            map.fitBounds(line.getBounds(), { padding: [16, 16] });
          }
          const list = document.getElementById('entries');
          (data.entries || []).forEach(e => {
            list.append(
              el(
                'article',
                { class: 'entry' },
                el('time', { text: new Date(e.recorded_at).toLocaleString() }),
                e.place_name ? el('div', { class: 'place', text: e.place_name }) : null,
                e.body ? el('p', { text: e.body }) : null,
                e.mood || e.weather ? el('div', { class: 'meta', text: [e.mood, e.weather].filter(Boolean).join(' · ') }) : null
              )
            );
          });
        })
        .catch(e => {
          document.getElementById('title').textContent = 'Wayfare journey';
          err.textContent = e.message;
        });
    })();
  </script>
</body>
</html>
